name: Build ECA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le projet
        run: unzip -o ECA*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Afficher les erreurs
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|Execution failed" -A3 build.log | head -80 > errors.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat errors.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "::error title=Erreurs de compilation::$(head -40 errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: ECA-apk
          path: app/build/outputs/apk/debug/*.apk
